apiVersion: apps/v1
kind: Deployment
metadata:
  name: league-draft
  labels:
    app: league-draft
spec:
  replicas: 2
  selector:
    matchLabels:
      app: league-draft
  template:
    metadata:
      labels:
        app: league-draft
    spec:
      containers:
        - name: league-draft
          image: us-east1-docker.pkg.dev/gaimplan-core/builds/league-draft:latest
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "False"
            - name: NUM_TRUSTED_PROXIES
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: league-draft-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: league-draft-secrets
                  key: secret-key
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: league-draft-config
                  key: allowed-hosts
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: league-draft-config
                  key: cors-origins
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: league-draft
  labels:
    app: league-draft
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: league-draft
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: league-draft-config
data:
  allowed-hosts: "league-draft.gaimplan.com"
  cors-origins: "https://league-draft.gaimplan.com"
---
# Note: Create secrets manually or via CI/CD:
# kubectl create secret generic league-draft-secrets \
#   --from-literal=database-url='postgresql://user:pass@host:5432/league_draft' \
#   --from-literal=secret-key='your-production-secret-key'
